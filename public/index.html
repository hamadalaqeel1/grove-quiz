<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e6f5e8">
  <meta name="description" content="Join a live Grove quiz with a room code.">
  <title>Join a quiz | Grove</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/" id="brand"><span id="brand-mark"></span>Grove</a>
    <div class="topbar-meta" id="meta"></div>
  </header>
  <div class="conn-banner" id="conn" role="status" hidden>
    <span class="spinner" aria-hidden="true"></span>
    Connection lost. Reconnecting&hellip;
  </div>
  <main id="main" tabindex="-1">
    <section class="narrow" id="view-join" aria-labelledby="join-title">
      <div class="join-hero">
        <h1 id="join-title">Join a quiz</h1>
        <p>Enter the room code from the host&rsquo;s screen and pick a name.</p>
      </div>

      <div class="room-info" id="room-info" hidden></div>
      <div class="notice" id="join-notice" role="alert" hidden></div>

      <form id="join-form" novalidate>
        <div class="field">
          <label for="code">Room code</label>
          <input class="input input-code" id="code" name="code" inputmode="numeric" autocomplete="off"
                 maxlength="7" placeholder="000 000" aria-describedby="code-help code-error" required>
          <p class="help" id="code-help">Six digits. Scanning the QR code fills this in for you.</p>
          <p class="error" id="code-error" hidden></p>
        </div>
        <div class="field">
          <label for="name">Your name</label>
          <input class="input" id="name" name="name" autocomplete="nickname" maxlength="20"
                 aria-describedby="name-help name-error" required>
          <p class="help" id="name-help">Up to 20 characters. Everyone in the room will see it.</p>
          <p class="error" id="name-error" hidden></p>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary btn-lg btn-block" type="submit" id="join-btn">Join game</button>
          <p class="error" id="form-error" role="alert" hidden></p>
        </div>
      </form>

      <p class="aside-link">Running the quiz? <a href="/host">Host a quiz</a></p>
    </section>

    <section class="narrow" id="view-game" hidden></section>
  </main>
  <script src="/socket.io/socket.io.min.js"></script>
  <script type="module" src="/js/play.js"></script>
</body>
</html>
