<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e3321">
  <meta name="description" content="Host a live Grove quiz: write questions, share a QR code, run the game.">
  <title>Host a quiz | Grove</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/host" id="brand"><span id="brand-mark"></span>Grove</a>
    <div class="topbar-meta" id="meta"></div>
  </header>
  <div class="conn-banner" id="conn" role="status" hidden>
    <span class="spinner" aria-hidden="true"></span>
    Connection lost. Reconnecting&hellip; The game keeps running for players.
  </div>
  <main id="main" tabindex="-1">
    <div id="view-loading" class="narrow" hidden>
      <div class="status-block" aria-busy="true">
        <span class="spinner" aria-hidden="true"></span>
        <p class="lead" role="status">Reconnecting to your room&hellip;</p>
      </div>
    </div>
    <div id="view-editor" hidden></div>
    <div id="view-stage" class="stage-wrap" hidden></div>
  </main>
  <script src="/socket.io/socket.io.min.js"></script>
  <script type="module" src="/js/host.js"></script>
</body>
</html>
